type: object
properties:
  content:
    type: string
    description: Message content for canned response
    example: 'Hello, {{contact.name}}! Welcome to our service.'
  short_code:
    type: string
    description: Short Code for quick access of the canned response
    example: 'welcome'
  access_scope:
    type: string
    enum: [everyone, specific_teams, specific_users, only_me]
    default: everyone
  allowed_team_ids:
    type: array
    items:
      type: integer
  allowed_user_ids:
    type: array
    items:
      type: integer
