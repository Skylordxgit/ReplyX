# Limcx Super Admin Features Catalog

# ------- Platform Operations & Security ------- #
custom_branding:
  name: 'Custom Branding'
  description: 'Manage white-labeling, brand names, logos and custom URLs for Limcx.'
  enabled: true
  icon: 'icon-paint-brush-line'
  config_key: 'general'
  category: 'Platform'

custom_roles:
  name: 'Custom Roles & Permissions'
  description: 'Role-based access control with granular platform and workspace permission policies.'
  enabled: true
  icon: 'icon-user-follow-line'
  category: 'Security'

audit_logs:
  name: 'Audit Logs'
  description: 'Track and trace workspace and user security events with immutable audit logs.'
  enabled: true
  icon: 'icon-menu-search-line'
  category: 'Security'

sla:
  name: 'Service Level Targets (SLA)'
  description: 'Define service level agreements, first response times, and resolution targets.'
  enabled: true
  icon: 'icon-hourglass-line'
  category: 'Operations'

agent_capacity:
  name: 'Agent Workload & Capacity'
  description: 'Automated queue routing, capacity limits, and real-time agent availability tracking.'
  enabled: true
  icon: 'icon-dashboard-line'
  category: 'Operations'

# ------- AI & Intelligence ------- #
captain:
  name: 'AI & Captain LLM Engine'
  description: 'Multi-provider AI intelligence with OpenAI, Anthropic Claude, and Google Gemini.'
  enabled: true
  icon: 'icon-captain'
  config_key: 'captain'
  category: 'AI'

